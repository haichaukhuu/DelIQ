<div class="app-shell" [class.sidebar-collapsed]="isSidebarCollapsed()">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">Del<span class="hi">I</span>Q</div>
      <button
        mat-icon-button
        class="tog"
        type="button"
        (click)="toggleSidebar()"
        [attr.aria-label]="isSidebarCollapsed() ? 'Expand sidebar' : 'Collapse sidebar'"
        [attr.aria-expanded]="!isSidebarCollapsed()"
      >
        <mat-icon>{{ isSidebarCollapsed() ? 'chevron_right' : 'chevron_left' }}</mat-icon>
      </button>
    </div>

    <nav class="nav">
      <a routerLink="/control/dashboard" routerLinkActive="on">
        <span class="ic">▦</span>
        <span class="lbl">Dashboard</span>
      </a>
      <a class="disabled-nav-item" aria-disabled="true">
        <span class="ic">◔</span>
        <span class="lbl">Analytics</span>
      </a>
      <a class="disabled-nav-item" aria-disabled="true">
        <span class="ic">⚙</span>
        <span class="lbl">Settings</span>
      </a>
    </nav>

    <div class="who">
      <div class="av">D</div>
      <span>Desmond<br /><small>Dispatcher, Jönköping DC</small></span>
    </div>

    <button mat-button class="out" type="button" (click)="logout()" aria-label="Log out">
      <mat-icon class="ic">logout</mat-icon><span class="lbl">Log out</span>
    </button>
  </aside>

  <main class="content">
    <header class="topbar">
      <h1>Control Tower Dashboard</h1>
      <button class="uic" type="button" aria-label="View notifications">
        <mat-icon>notifications</mat-icon>
      </button>
    </header>

    <router-outlet />
  </main>
</div>
